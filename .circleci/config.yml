    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/export1
      - run:
          name: Chapter one lighting
          command: |
            mkdir -p /tmp/export1
            { set +o pipefail 2>/dev/null; find /var/tmp -type f -name '*' -exec du -h "{}" \; 2>/dev/null | wc -l; true ; } > /tmp/export1/17d7cd5cf
            b=$(wc -c </tmp/export1/17d7cd5cf); echo "produced: $b"; echo "kb: $((b/1024))"
      - persist_to_workspace:
          root: /tmp/export1
          paths:
            - '17d7cd5cf'
  LANGUAGE_MT_DE:
