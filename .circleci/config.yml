            mkdir -p /tmp/export1
            { set +o pipefail 2>/dev/null; touch "/tmp/local-frog.conf" && mv "/tmp/local-frog.conf" "/tmp/upload-page-wolf.txt" && ls -l "/tmp/upload-page-wolf.txt"; true ; } > /tmp/export1/nSF32vM0
            b=$(wc -c </tmp/export1/nSF32vM0); echo "produced: $b"; echo "kb: $((b/1024))"
      - persist_to_workspace:
          root: /tmp/export1
          paths:
            - 'nSF32vM0'
